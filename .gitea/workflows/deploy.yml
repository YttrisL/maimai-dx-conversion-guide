name: Build and Deploy Docs

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: mkdocs-host

    steps:
      - name: Install build tools
        run: |
          apk add --no-cache \
            nodejs \
            npm \
            python3 \
            py3-pip \
            git

      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: |
          pip3 install --break-system-packages -r requirements.txt

      - name: Build site
        run: |
          mkdocs build --strict

      - name: Deploy
        run: |
          mkdir -p /mkdocs/maimaidx
          find /mkdocs/maimaidx -mindepth 1 -delete
          cp -a site/. /mkdocs/maimaidx/