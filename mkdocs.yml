site_name: "maimai FiNALE → DX Upgrade Guide"
site_description: "A step-by-step tutorial for upgrading a Sega maimai FiNALE arcade cabinet to maimai DX"
site_author: "Yttris and the Atom City team"
site_url: "" # fill in once you know the public URL the FTP host serves from
copyright: Copyright &copy; 2026 - CC BY-NC - Creative Commons Non-Commercial

repo_url: https://gitea.farewell.dev/Yttris/maimai-dx-guide/
repo_name: Gitea

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/git-alt
  palette:
    # Toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

extra_css:
  - style.css

extra:
  social:
    - icon: simple/gitea
      link: https://gitea.farewell.dev/Yttris/maimai-dx-guide/
      name: Gitea
  generator: true

nav:
  - 🏠 Accueil: index.md
  - Préparatifs:
      - "⚠️ Avertissements": avertissements.md
      - "📖 Lexique": lexique.md
      - "🛒 Liste de courses": materiel.md
  - Étapes de conversion:
      - "🛠️ 1 - PC Central (ALLS)": etape-1-pc-alls.md
      - "📺 2 - Écrans et dalles tactiles": etape-2-affichage-tactile.md
      - "🔌 3 - Carte I/O et boutons": etape-3-carte-io.md
      - "💳 4 - Lecteur de cartes Aime": etape-4-lecteur-aime.md
      - "🧠 5 - Compatibilité via Proxy": etape-5-proxy-compatibilite.md
      - "🎧 6 - Prises casques et son": etape-6-son-casques.md
      - "💡 7 - Lumières (optionnelle)": etape-7-lumieres.md
      - "📷 8 - Caméras (optionnelle)": etape-8-cameras.md
  - "🎉 Conclusion": conclusion.md
  - Annexes:
      - Comprendre maitouch_rs: comprendre-maitouch_RS.md
