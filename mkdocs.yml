site_name: "maimai FiNALE → DX Upgrade Guide"
site_description: "A step-by-step tutorial for upgrading a Sega maimai FiNALE arcade cabinet to maimai DX"
site_author: "Yttris"
site_url: "https://dxnale.guide/"
copyright: Copyright &copy; 2026 - CC BY-NC - Creative Commons Non-Commercial

repo_url: &github_repo_url https://github.com/YttrisL/maimai-dx-conversion-guide
repo_name: GitHub

strict: true

validation:
  links:
    anchors: warn
    unrecognized_links: warn

hooks:
  - hooks/check_translations.py
  - hooks/link_constants.py
  - hooks/dedupe_static_resources.py
  - hooks/copy_sitemap.py
  - hooks/lightbox.py
  - hooks/title_emoji.py

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    # Toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: "Guide de conversion maimai FiNALE → DX"
          site_description: "Un tutoriel pas à pas pour convertir une borne d'arcade Sega maimai FiNALE en maimai DX"
          nav_translations:
            Preparation: Préparatifs
            Conversion steps: Étapes de conversion
            Appendices: Annexes
  - git-revision-date-localized:
      enable_creation_date: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

extra_css:
  - style.css

extra_javascript:
  - checklist-persist.js
  - lightbox.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: *github_repo_url
      name: GitHub
  generator: true

nav:
  - index.md
  - Preparation:
      - warnings.md
      - equipment.md
  - Conversion steps:
      - step-1-alls-and-psu.md
      - step-2-touchscreen-display.md
      - step-3-io-board.md
      - step-4-aime-reader.md
      - step-5-audio-headphones.md
      - step-6-lighting.md
      - step-7-cameras.md
  - conclusion.md
  - Appendices:
      - glossary.md
      - official-manuals.md
      - wiring-diagrams.md
      - understanding-serial-protocols.md
      - secondhand-market.md
      - useful-links.md
