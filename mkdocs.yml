site_name: "maimai FiNALE → DX Upgrade Guide"
site_description: "A step-by-step tutorial for upgrading a Sega maimai FiNALE arcade cabinet to maimai DX"
site_author: "Yttris and the Atom City team"
site_url: "" # fill in once you know the public URL the FTP host serves from
copyright: Copyright &copy; 2026 - CC BY-NC - Creative Commons Non-Commercial

repo_url: https://gitea.farewell.dev/Yttris/maimai-dx-guide/
repo_name: Gitea

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/git-alt
  palette:
    # Toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Preparation: Préparatifs
            Conversion steps: Étapes de conversion
            Appendices: Annexes
      # Individual page titles need no entry here: they come from each
      # translated file's own `title:` front-matter (see docs/*.md and
      # docs/*.fr.md).
  - git-revision-date-localized:
      enable_creation_date: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

extra_css:
  - style.css

extra:
  social:
    - icon: simple/gitea
      link: https://gitea.farewell.dev/Yttris/maimai-dx-guide/
      name: Gitea
  generator: true

nav:
  - index.md
  - Preparation:
      - warnings.md
      - glossary.md
      - equipment.md
  - Conversion steps:
      - step-1-pc-alls.md
      - step-2-touchscreen-display.md
      - step-3-io-board.md
      - step-4-aime-reader.md
      - step-5-proxy-compatibility.md
      - step-6-audio-headphones.md
      - step-7-lighting.md
      - step-8-cameras.md
  - conclusion.md
  - Appendices:
      - understanding-maitouch_RS.md
