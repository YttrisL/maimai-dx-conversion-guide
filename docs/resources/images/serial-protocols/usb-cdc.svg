<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Card background so the diagram reads on both light and dark themes -->
  <rect x="1" y="1" width="638" height="198" rx="12" fill="#f4f4f6" stroke="#c9c9cf" stroke-width="2"/>

  <title>USB-CDC : un port RS-232 simulé par-dessus l'USB</title>

  <defs>
    <marker id="arrowRightUsb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">USB-CDC : le déguisement</text>

  <!-- Device -->
  <rect x="40" y="80" width="170" height="60" rx="10" fill="#eceef2" stroke="#333" stroke-width="2.5"/>
  <text x="125" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Dalle tactile ADX</text>

  <!-- Arrow -->
  <line x1="210" y1="110" x2="430" y2="110" stroke="#555" stroke-width="2.5" marker-end="url(#arrowRightUsb)"/>
  <text x="320" y="97" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555">paquets USB, « je suis un port série »</text>

  <!-- Virtual COM port -->
  <rect x="430" y="80" width="170" height="60" rx="10" fill="#f7e6d9" stroke="#e07b39" stroke-width="2.5"/>
  <text x="515" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4a1e">Port COM virtuel</text>

  <!-- Captions -->
  <text x="125" y="163" text-anchor="middle" font-size="12" fill="#555">(rapide, sans bauds)</text>
  <text x="515" y="163" text-anchor="middle" font-size="12" fill="#555">(le logiciel croit lire du 9600 bauds)</text>
</svg>
