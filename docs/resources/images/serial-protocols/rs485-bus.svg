<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Card background so the diagram reads on both light and dark themes -->
  <rect x="1" y="1" width="638" height="238" rx="12" fill="#f4f4f6" stroke="#c9c9cf" stroke-width="2"/>

  <title>RS-485 : bus partagé, paire différentielle A/B</title>

  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">RS-485 : bus partagé (paire différentielle A/B)</text>

  <!-- Differential pair bus -->
  <text x="320" y="50" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555">Paire différentielle A/B - plusieurs appareils sur les deux mêmes fils</text>
  <line x1="60" y1="64" x2="580" y2="64" stroke="#3b82c4" stroke-width="3"/>
  <line x1="60" y1="76" x2="580" y2="76" stroke="#e07b39" stroke-width="3"/>
  <text x="42" y="68" text-anchor="end" font-size="12" fill="#3b82c4">A</text>
  <text x="42" y="80" text-anchor="end" font-size="12" fill="#e07b39">B</text>
  <text x="598" y="68" text-anchor="start" font-size="12" fill="#3b82c4">A</text>
  <text x="598" y="80" text-anchor="start" font-size="12" fill="#e07b39">B</text>

  <!-- Stubs down to each node: BOTH conductors (A and B) tap the bus and reach every node -->
  <g>
    <!-- Hôte -->
    <line x1="143" y1="64" x2="143" y2="140" stroke="#3b82c4" stroke-width="2.5"/>
    <line x1="157" y1="76" x2="157" y2="140" stroke="#e07b39" stroke-width="2.5"/>
    <circle cx="143" cy="64" r="3.5" fill="#3b82c4"/>
    <circle cx="157" cy="76" r="3.5" fill="#e07b39"/>

    <!-- Nœud 1 -->
    <line x1="313" y1="64" x2="313" y2="140" stroke="#3b82c4" stroke-width="2.5"/>
    <line x1="327" y1="76" x2="327" y2="140" stroke="#e07b39" stroke-width="2.5"/>
    <circle cx="313" cy="64" r="3.5" fill="#3b82c4"/>
    <circle cx="327" cy="76" r="3.5" fill="#e07b39"/>

    <!-- Nœud 2 -->
    <line x1="483" y1="64" x2="483" y2="140" stroke="#3b82c4" stroke-width="2.5"/>
    <line x1="497" y1="76" x2="497" y2="140" stroke="#e07b39" stroke-width="2.5"/>
    <circle cx="483" cy="64" r="3.5" fill="#3b82c4"/>
    <circle cx="497" cy="76" r="3.5" fill="#e07b39"/>
  </g>

  <!-- Hôte (master) -->
  <rect x="80" y="140" width="140" height="70" rx="8" fill="#eceef2" stroke="#333" stroke-width="2.5"/>
  <text x="150" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Hôte</text>
  <text x="150" y="192" text-anchor="middle" font-size="11.5" font-style="italic" fill="#666">(maître)</text>

  <!-- Nœud 1 (slave) -->
  <rect x="250" y="140" width="140" height="70" rx="8" fill="#eceef2" stroke="#8a8f9b" stroke-width="2"/>
  <text x="320" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Nœud 1</text>
  <text x="320" y="192" text-anchor="middle" font-size="11.5" font-style="italic" fill="#666">(esclave)</text>

  <!-- Nœud 2 (slave) -->
  <rect x="420" y="140" width="140" height="70" rx="8" fill="#eceef2" stroke="#8a8f9b" stroke-width="2"/>
  <text x="490" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Nœud 2</text>
  <text x="490" y="192" text-anchor="middle" font-size="11.5" font-style="italic" fill="#666">(esclave)</text>
</svg>
