<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="18 17 917 419" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:bx="https://boxy-svg.com">
  <!--
    Wiring harness for the billboard lighting (Step 6).
    Overview, left to right:
      1) Sources on the IO4: CN9 (2x10, top), internal 12V power supply (center),
         CN3 (2x30 rotated 90 degrees, bottom) - only the pins that are actually wired are colored in.
      2) Common sheath: the 8 wires (12V, RED, GREEN, BLUE x2 - one set per P1/P2 side) are bundled
         over ~2 meters, all together up to the Y split.
      3) Y split: solid line = "L" wire to P1 (left); dashed line = "R" wire to P2 (right).
      4) Output 8-pin JST-SM connectors, horizontal: P1 on top (cables joined from below,
         pins 1-4 bridged to 5-8 to duplicate the signal to CENTER LED), P2 on the bottom (cables
         joined from above, pins 5-8 unused).
    File cropped to the actual content (offset viewBox) to avoid dead margins.
  -->
  <defs>
    <bx:export>
      <bx:file format="svg" href="#object-0" path="Sans titre.svg"/>
    </bx:export>
  </defs>
  <title>Wiring harness linking the 20 pins of CN9 (2x10), an excerpt of CN3 (2x30, rotated) and the IO4's internal 12V power supply to two horizontal 8-pin JST-SM connectors, via a common sheath split into a Y</title>

  <!-- Card background (readable on light and dark themes) -->
  <rect x="19" y="18" width="915" height="417" rx="12" fill="#f4f4f6" stroke="#c9c9cf" stroke-width="2" id="object-0"/>

  <!-- ===================== CN9: IO4, 20-pin JST-RA connector, 2x10 layout ===================== -->
  <!-- Only pins 5, 6 (GREEN L/R), 9, 10 (BLUE L/R) are wired here; the others are greyed out. -->
  <text x="55.114" y="49.527" font-size="13" font-weight="bold" fill="#222" style="white-space: pre; font-size: 13px;">IO4 - CN9 (JST-RA 20 pins, 2x10)</text>
  <rect x="55" y="56" width="390" height="85" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="80" cy="81" r="8" fill="#ddd"/>
  <text x="80" y="84.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">2</text>
  <circle cx="80" cy="116" r="8" fill="#ddd"/>
  <text x="80" y="119.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">1</text>
  <circle cx="118" cy="81" r="8" fill="#ddd"/>
  <text x="118" y="84.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">4</text>
  <circle cx="118" cy="116" r="8" fill="#ddd"/>
  <text x="118" y="119.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">3</text>
  <circle cx="156" cy="81" r="8" fill="#2f9e5c"/>
  <text style="white-space: pre;" x="156" y="84.5" text-anchor="middle" font-weight="bold" font-size="8.5" fill="#fff">6</text>
  <text style="fill: rgb(47, 158, 92); font-size: 7.5px; font-weight: 700; white-space: pre;" x="168" y="79" dx="-0.262" dy="4.792">R</text>
  <circle cx="156" cy="116" r="8" fill="#2f9e5c"/>
  <text x="156" y="119.5" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#fff" style="white-space: pre;">5</text>
  <text style="fill: rgb(47, 158, 92); font-size: 7.5px; font-weight: 700; white-space: pre;" x="168" y="120" dx="-0.517" dy="-1.714">L</text>
  <circle cx="194" cy="81" r="8" fill="#ddd"/>
  <text x="194" y="84.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">8</text>
  <circle cx="194" cy="116" r="8" fill="#ddd"/>
  <text x="194" y="119.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">7</text>
  <circle cx="232" cy="81" r="8" fill="#3b82c4"/>
  <text x="232" y="84.5" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#fff" style="white-space: pre;">10</text>
  <text x="244" y="79" font-size="7.5" font-weight="bold" fill="#3b82c4" style="white-space: pre;">R</text>
  <circle cx="232" cy="116" r="8" fill="#3b82c4"/>
  <text x="232" y="119.5" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#fff" style="white-space: pre;">9</text>
  <text x="244" y="120" font-size="7.5" font-weight="bold" fill="#3b82c4" style="white-space: pre;">L</text>
  <circle cx="270" cy="81" r="8" fill="#ddd"/>
  <text x="270" y="84.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">12</text>
  <circle cx="270" cy="116" r="8" fill="#ddd"/>
  <text x="270" y="119.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">11</text>
  <circle cx="308" cy="81" r="8" fill="#ddd"/>
  <text x="308" y="84.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">14</text>
  <circle cx="308" cy="116" r="8" fill="#ddd"/>
  <text x="308" y="119.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">13</text>
  <circle cx="346" cy="81" r="8" fill="#ddd"/>
  <text x="346" y="84.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">16</text>
  <circle cx="346" cy="116" r="8" fill="#ddd"/>
  <text x="346" y="119.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">15</text>
  <circle cx="384" cy="81" r="8" fill="#ddd"/>
  <text x="384" y="84.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">18</text>
  <circle cx="384" cy="116" r="8" fill="#ddd"/>
  <text x="384" y="119.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">17</text>
