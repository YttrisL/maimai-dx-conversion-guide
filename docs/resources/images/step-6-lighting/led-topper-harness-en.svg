  <circle cx="650" cy="310" r="9" fill="#d98a1f"/>
  <text x="650" y="313.5" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#fff" style="white-space: pre;">1</text>
  <circle cx="684" cy="310" r="9" fill="#d1453b"/>
  <text x="684" y="313.5" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#fff" style="white-space: pre;">2</text>
  <circle cx="718" cy="310" r="9" fill="#2f9e5c"/>
