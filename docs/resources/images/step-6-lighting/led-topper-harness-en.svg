  <path d="M 63.221 329.256 C 54.541 306.182 133.086 345.489 125.432 266.577 C 119.855 209.081 190 224 230 221" fill="none" stroke="#d1453b" stroke-width="2.2"/>
  <path d="M 97.593 335.774 C 154.059 341.909 139.109 283.206 139.068 250.865 C 132.862 228.473 220 226 230 226" fill="none" stroke="#d1453b" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- Frames of the 2 output connectors, drawn BEFORE the wires so the wires stay visible on top -->
