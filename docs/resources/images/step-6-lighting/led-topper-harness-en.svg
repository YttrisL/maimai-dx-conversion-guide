  <text x="422" y="84.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">20</text>
  <circle cx="422" cy="116" r="8" fill="#ddd"/>
  <text x="422" y="119.5" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre;">19</text>
  <!-- Wires leaving CN9 towards the sheath: routing around the bottom row for the top-row pins -->
  <path d="M 150.193 84.152 C 142.615 91.158 138.265 98.864 139.94 140.979" fill="none" stroke="#2f9e5c" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M 156 124 L 156 141" fill="none" stroke="#2f9e5c" stroke-width="2.2"/>
  <path d="M 230.398 86.928 C 216.7 90.474 215.993 99.43 208.007 137.071" fill="none" stroke="#3b82c4" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M 225.422 118.02 L 217.649 141" fill="none" stroke="#3b82c4" stroke-width="2.2"/>
  <path d="M 140.531 142.191 C 138.274 223.092 193.263 207.003 230 206" fill="none" stroke="#2f9e5c" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M 156 141 C 147.633 216.707 200 201 230 201" fill="none" stroke="#2f9e5c" stroke-width="2.2"/>
  <path d="M 207.067 141.941 C 189.037 236.616 230.912 213.257 242.341 216" fill="none" stroke="#3b82c4" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M 217.649 142.196 C 213.283 175.254 207.291 216 230 211" fill="none" stroke="#3b82c4" stroke-width="2.2"/>
  <!-- ===================== Internal 12V power supply (common source, outside the IO4) ===================== -->
  <!-- 2 dedicated wires (solid -> P1, dashed -> P2): the 12V never goes through CN9. -->
  <rect x="42.067" y="183.967" width="64.055" height="46.86" rx="8" fill="#eceef2" stroke="#d98a1f" stroke-width="2" style=""/>
  <text x="75" y="204" text-anchor="middle" font-size="9" fill="#222" style="white-space: pre;">Internal</text>
