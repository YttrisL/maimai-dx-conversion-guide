  <path d="M 106.726 204.743 C 130.781 200.246 210 196 230 196" fill="none" stroke="#d98a1f" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- ===================== Common sheath: 8 wires over ~2 meters ===================== -->
  <rect x="256.208" y="184.397" width="385.122" height="50" rx="20" fill="#e4e4e8" stroke="#888" stroke-width="1.5" style="" transform="matrix(1, 0.000357, 0, 1, -25.383949, -0.153216)"/>
  <line x1="230" y1="191" x2="526" y2="191" stroke="#d98a1f" stroke-width="2.2"/>
  <line x1="230" y1="196" x2="526" y2="196" stroke="#d98a1f" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="230" y1="201" x2="526" y2="201" stroke="#2f9e5c" stroke-width="2.2"/>
  <line x1="230" y1="206" x2="526" y2="206" stroke="#2f9e5c" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="230" y1="211" x2="526" y2="211" stroke="#3b82c4" stroke-width="2.2"/>
  <line x1="230" y1="216" x2="526" y2="216" stroke="#3b82c4" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="230" y1="221" x2="526" y2="221" stroke="#d1453b" stroke-width="2.2"/>
  <line x1="230" y1="226" x2="526" y2="226" stroke="#d1453b" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="430.029" y="179.657" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" style="white-space: pre; font-size: 11.5px;">&#8776; 2 meters (common sheath, 8 wires)</text>
  <!-- ===================== CN3: IO4, 60-pin JST-RA connector, 2x30 layout, rotated 90 degrees clockwise ===================== -->
  <!-- Only the column of pins 49-54 is shown (the other 54 pins are omitted, see the dashed
       lines top/bottom). After rotation: odd (49/51/53) on the left, even (50/52/54) on the right.
       Only 51 (L) and 52 (R) are wired (BILLBOARD LED RED) - connector already in place since Step 3. -->
  <text x="234.084" y="375.998" text-anchor="middle" font-size="13" font-weight="bold" fill="#222" style="white-space: pre; font-size: 13px;">IO4 - CN3 (JST-RA 60 pins, 2x30)</text>
  <text x="196.412" y="388.204" text-anchor="middle" font-size="9" fill="#999" font-style="italic" style="white-space: pre; font-size: 9px;">(only the useful portion is shown)</text>
  <!-- real edges (solid) left/right, "cut" edges (dashed) top/bottom -->
  <line x1="38.221" y1="278.206" x2="38.221" y2="392.206" stroke="#333" stroke-width="2"/>
  <line x1="114.221" y1="278.206" x2="114.221" y2="392.206" stroke="#333" stroke-width="2"/>
  <line x1="38.221" y1="278.206" x2="114.221" y2="278.206" stroke="#333" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="38.221" y1="392.206" x2="114.221" y2="392.206" stroke="#333" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="76.221" y="259.206" text-anchor="middle" font-size="8.5" fill="#999" font-style="italic" style="white-space: pre; font-size: 8.5px;" transform="matrix(1, 0, 0, 1, -0.597964, 13.155216)">(1 to 48 omitted)<tspan x="76.22100067138672" dy="1em">&#8203;</tspan></text>
  <text x="75.221" y="405.206" text-anchor="middle" font-size="8.5" fill="#999" font-style="italic" style="white-space: pre; font-size: 8.5px;" transform="matrix(1, 0, 0, 1, -0.597964, -1.195929)">(55 to 60 omitted)<tspan x="75.22100067138672" dy="1em">&#8203;</tspan></text>
  <circle cx="63.221" cy="297.206" r="8" fill="#ddd"/>
  <text x="63.221" y="300.706" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre; font-size: 8px;">49</text>
  <circle cx="89.221" cy="297.206" r="8" fill="#ddd"/>
  <text x="89.221" y="300.706" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre; font-size: 8px;">50</text>
  <circle cx="63.221" cy="335.206" r="8" fill="#d1453b"/>
  <text x="63.221" y="338.706" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff" style="white-space: pre; font-size: 8px;">51</text>
  <text style="fill: rgb(209, 69, 59); font-size: 7.5px; font-weight: 700; text-anchor: middle; white-space: pre;" x="63.221" y="321.206" dy="31.692">L</text>
  <circle cx="89.221" cy="335.206" r="8" fill="#d1453b"/>
  <text x="89.221" y="338.706" text-anchor="middle" font-size="8" font-weight="bold" fill="#fff" style="white-space: pre; font-size: 8px;">52</text>
  <text style="fill: rgb(209, 69, 59); font-size: 7.5px; font-weight: 700; text-anchor: middle; white-space: pre;" x="89.221" y="321.206" dx="-0.598" dy="31.692">R</text>
  <circle cx="63.221" cy="373.206" r="8" fill="#ddd"/>
  <text x="63.221" y="376.706" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre; font-size: 8px;">53</text>
  <circle cx="89.221" cy="373.206" r="8" fill="#ddd"/>
  <text x="89.221" y="376.706" text-anchor="middle" font-size="8" fill="#888" style="white-space: pre; font-size: 8px;">54</text>
