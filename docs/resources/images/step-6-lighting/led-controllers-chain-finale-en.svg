<svg viewBox="0 0 910 230" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Card background so the diagram reads on both light and dark themes -->
  <rect x="1" y="1" width="908" height="228" rx="12" fill="#f4f4f6" stroke="#c9c9cf" stroke-width="2"/>

  <title>Lighting control chain on FiNALE: P1/P2 LED boards, RS-232, USB adapter, RingEdge 2</title>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82c4"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d1453b"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Board P1 (top-left) -->
  <rect x="20" y="20" width="270" height="90" rx="10" fill="#eceef2" stroke="#3b82c4" stroke-width="2.5"/>
  <text x="155" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">LED control board - P1</text>
  <text x="155" y="68" text-anchor="middle" font-size="12" fill="#555" font-style="italic">part no. 837-15070-02-91</text>
  <text x="155" y="89" text-anchor="middle" font-size="11" fill="#555">Buttons, background, woofers, billboard (P1 side)</text>

  <!-- Board P2 (bottom-left) -->
  <rect x="20" y="120" width="270" height="90" rx="10" fill="#eceef2" stroke="#d1453b" stroke-width="2.5"/>
  <text x="155" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">LED control board - P2</text>
  <text x="155" y="168" text-anchor="middle" font-size="12" fill="#555" font-style="italic">part no. 837-15070-02-91 (same as P1)</text>
  <text x="155" y="189" text-anchor="middle" font-size="11" fill="#555">Buttons, background, woofers, billboard (P2 side)</text>

  <!-- RS-232 links to adapter -->
  <line x1="290" y1="65" x2="377" y2="85" stroke="#3b82c4" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="290" y1="165" x2="377" y2="145" stroke="#d1453b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="333" y="63" text-anchor="middle" font-size="12" fill="#555" font-style="italic">RS-232</text>
  <text x="333" y="175" text-anchor="middle" font-size="12" fill="#555" font-style="italic">RS-232</text>

  <!-- Adapter (center) -->
  <rect x="380" y="70" width="280" height="90" rx="10" fill="#eceef2" stroke="#333" stroke-width="2.5"/>
  <text x="520" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">RS-232 &#8594; USB adapter</text>
  <text x="520" y="118" text-anchor="middle" font-size="12" fill="#555" font-style="italic">part no. 837-15067-02</text>
  <text x="520" y="139" text-anchor="middle" font-size="11.5" fill="#555">Same adapter as on DX</text>

  <!-- Adapter -> RingEdge 2 -->
  <line x1="660" y1="115" x2="728" y2="115" stroke="#555" stroke-width="2.5" marker-end="url(#arrowGrey)"/>
  <text x="694" y="103" text-anchor="middle" font-size="12" fill="#555">USB</text>

  <!-- RingEdge 2 (direct USB connection, no hub) -->
  <rect x="730" y="70" width="160" height="90" rx="10" fill="#eceef2" stroke="#333" stroke-width="2.5"/>
  <text x="810" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">RingEdge 2</text>
  <text x="810" y="118" text-anchor="middle" font-size="11.5" fill="#555">Direct USB connection</text>
  <text x="810" y="139" text-anchor="middle" font-size="11.5" fill="#555" font-style="italic">(no USB hub)</text>
</svg>
