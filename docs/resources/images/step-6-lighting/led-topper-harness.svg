<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="18 17 917 419" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:bx="https://boxy-svg.com">
  <!--
    Nappe de câbles pour l'éclairage de l'enseigne lumineuse (Étape 6).
    Vue d'ensemble, de gauche à droite :
      1) Sources sur l'IO4 : CN9 (2x10, en haut), alimentation 12V interne (au centre),
         CN3 (2x30 pivoté à 90°, en bas) - seules les broches réellement câblées sont mises en couleur.
      2) Gaine commune : les 8 fils (12V, ROUGE, VERT, BLEU x2 - un jeu par côté P1/P2) sont regroupés
         sur ~3 mètres, tous solidaires jusqu'à la séparation en Y.
      3) Séparation en Y : trait plein = fil "L" vers P1 (gauche) ; trait pointillé = fil "R" vers P2 (droit).
      4) Connecteurs JST-SM 8 broches de sortie, horizontaux : P1 en haut (câbles raccordés par le bas,
         broches 1-4 pontées vers 5-8 pour dupliquer le signal vers CENTER LED), P2 en bas (câbles
         raccordés par le haut, broches 5-8 non utilisées).
    Fichier recadré sur le contenu réel (viewBox décalé) pour éviter les marges mortes.
  -->
  <defs>
    <bx:export>
      <bx:file format="svg" href="#object-0" path="Sans titre.svg"/>
    </bx:export>
  </defs>
  <title>Nappe de câbles reliant les 20 broches du CN9 (2x10), un extrait du CN3 (2x30, pivoté) et l'alimentation 12V interne de l'IO4 à deux connecteurs JST-SM 8 broches horizontaux, via une gaine commune séparée en Y</title>

